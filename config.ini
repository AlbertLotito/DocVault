[server]
host = 127.0.0.1
port = 8050

[paths]
scan_directory =
cache_directory = .cache\extracted_images

[database]
sqlite_path = docvault.db

[llm]
provider = ollama

[tesseract]
path = C:\Program Files\Tesseract-OCR\tesseract.exe

[ollama]
host = http://localhost:11629
chat_model = qwen2.5:14b
embed_model = nomic-embed-text
num_ctx = 8192
temperature = 0.1
num_predict = -1
top_p = 0.9
repeat_penalty = 1.1

[lancedb]
path = lancedb_storage

[pdf]
poppler_path = bin\poppler\Library\bin
sparse_threshold = 50

[vision]
model = minicpm-v
describe_images = true

[embeddings]
chunk_size = 600
chunk_overlap = 100
score_threshold = 0.65

[search]
rag_top_k = 5
rag_threshold = 0.50
result_limit = 20
fts_weight = 0.4
sem_weight = 0.6

[video]
describe_frames = true
frame_interval = 10

[google]
credentials_path = credentials\google_credentials.json
token_path = credentials\google_token.json
