services:
  docvault:
    build: .
    ports:
      - "8050:8050"
    volumes:
      # Mount the entire project directory into the container.
      # This allows you to edit code on your machine and see the
      # changes instantly inside the container without rebuilding.
      - .:/app
    # No external services required: the main document vector store and the
    # optional CLIP art-identification index both run on embedded LanceDB
    # (lancedb_storage/). DocVault runs standalone.
