services:
  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    # This healthcheck ensures the docvault service will wait until Qdrant is
    # actually ready to accept connections before starting.
    healthcheck:
      test: ["CMD", "/usr/bin/health_check"]
      interval: 5s
      timeout: 3s
      retries: 5

  docvault:
    build: .
    ports:
      - "8000:8000"
    volumes:
      # Mount the entire project directory into the container.
      # This allows you to edit code on your machine and see the
      # changes instantly inside the container without rebuilding.
      - .:/app
    depends_on:
      qdrant:
        condition: service_healthy
