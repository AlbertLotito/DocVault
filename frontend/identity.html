<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DocVault — Identity Hub</title>
  <link rel="stylesheet" href="/static/lcars.css">
  <script src="/static/app.js"></script>
  <style>
    .identity-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 10px;
      padding: 0 20px 20px;
    }
    .identity-card {
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-top: 3px solid var(--c-accent-dim);
      overflow: hidden;
      position: relative;
    }
    .identity-card:hover { border-color: var(--c-accent); }
    .identity-thumb {
      width: 100%;
      aspect-ratio: 1;
      background: var(--c-panel);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .identity-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .identity-thumb-placeholder { font-size: 36px; opacity: 0.2; }
    .identity-sightings {
      position: absolute;
      top: 6px; right: 6px;
      background: rgba(0,0,0,0.7);
      color: var(--c-warn);
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 8px;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
    }
    .identity-info { padding: 8px 10px; }
    .identity-name {
      color: var(--c-accent);
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .identity-cluster-id {
      color: var(--c-label-dim);
      font-size: 10px;
      font-family: monospace;
      margin-bottom: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .identity-actions { display: flex; gap: 5px; }
    .identity-rename-btn {
      background: none; border: none; cursor: pointer;
      color: var(--c-label-dim); padding: 0; font-size: 14px;
      flex-shrink: 0;
    }
    .identity-rename-btn:hover { color: var(--c-accent); }
  </style>
</head>
<body data-page="identity">
  <div class="lc-nav"></div>

  <div class="lc-page lc-page-pad">

    <div class="lc-section-title" style="padding-top:14px;">
      Identity Hub
      <button onclick="loadRegistry()" class="lc-btn lc-btn-sm" style="margin-left:auto;">Refresh</button>
    </div>

    <div class="identity-grid" id="identity-grid">
      <div style="color:var(--c-label-dim);font-size:11px;padding:20px;">Scanning for identities…</div>
    </div>

  </div>

  <!-- Rename Modal -->
  <div id="rename-modal" class="lc-modal-backdrop">
    <div class="lc-modal">
      <div class="lc-modal-title">Rename Identity</div>
      <input type="text" id="new-name-input" class="lc-input" style="margin-bottom:16px;"
             placeholder="Enter name…"
             onkeydown="if(event.key==='Enter')executeRename()">
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button onclick="closeRenameModal()" class="lc-btn lc-btn-sm">Cancel</button>
        <button onclick="executeRename()" class="lc-btn lc-btn-sm lc-btn-primary">Save Name</button>
      </div>
    </div>
  </div>

  <script src="/static/lcars.js"></script>
  <script>
    let activeClusterId = null;

    async function loadRegistry() {
      const grid = document.getElementById('identity-grid');
      grid.innerHTML = '<div style="color:var(--c-label-dim);font-size:11px;padding:20px;">Loading…</div>';
      try {
        const people = await api('/identity/registry');

        if (people.length === 0) {
          grid.innerHTML = `
            <div style="color:var(--c-label-dim);font-size:11px;text-align:center;padding:40px 20px;">
              <div style="font-size:32px;margin-bottom:10px;opacity:0.3;">👤</div>
              <div>No identities discovered yet.</div>
              <div style="margin-top:5px;color:var(--c-label-dim);">
                Run the Face Identity Extractor in the Lab or scan a vault with images.
              </div>
            </div>`;
          return;
        }

        grid.innerHTML = people.map(p => `
          <div class="identity-card">
            <div class="identity-thumb">
              ${p.thumbnail_path
                ? `<img src="${p.thumbnail_path}" alt="${_esc(p.person_name)}">`
                : `<span class="identity-thumb-placeholder">👤</span>`}
              <div class="identity-sightings">${p.detection_count} sightings</div>
            </div>
            <div class="identity-info">
              <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px;">
                <div class="identity-name" title="${_esc(p.person_name)}">${_esc(p.person_name)}</div>
                <button class="identity-rename-btn"
                  onclick="openRenameModal('${_esc(p.cluster_id)}', '${_esc(p.person_name)}')"
                  title="Rename">✎</button>
              </div>
              <div class="identity-cluster-id">${_esc(p.cluster_id)}</div>
              <div class="identity-actions">
                <a href="/vault?query=${encodeURIComponent(p.person_name)}"
                   class="lc-btn lc-btn-sm" style="flex:1;text-align:center;">Find Photos</a>
              </div>
            </div>
          </div>
        `).join('');
      } catch (err) {
        grid.innerHTML = `<div style="color:var(--c-error);font-size:11px;padding:20px;">
          Failed to load registry: ${_esc(err.message)}</div>`;
      }
    }

    function openRenameModal(id, currentName) {
      activeClusterId = id;
      document.getElementById('new-name-input').value = currentName;
      document.getElementById('rename-modal').classList.add('open');
      document.getElementById('new-name-input').focus();
    }

    function closeRenameModal() {
      document.getElementById('rename-modal').classList.remove('open');
      activeClusterId = null;
    }

    async function executeRename() {
      const newName = document.getElementById('new-name-input').value.trim();
      if (!newName || !activeClusterId) return;
      try {
        await api('/identity/rename', {
          method: 'POST',
          body: JSON.stringify({ cluster_id: activeClusterId, new_name: newName })
        });
        closeRenameModal();
        loadRegistry();
      } catch (err) {
        lcToast('Rename failed: ' + err.message, true);
      }
    }

    window.onload = loadRegistry;
  </script>
</body>
</html>
