<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DocVault — Search</title>
  <link rel="stylesheet" href="/static/lcars.css">
  <link href="/static/styles.css" rel="stylesheet">
  <script src="/static/app.js"></script>
  <style>
    .search-result {
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      border-left: 3px solid var(--c-accent-dim);
      padding: 10px 14px;
      margin-bottom: 6px;
    }
    .search-result-file { color: var(--c-accent); font-size: 13px; font-weight: bold; }
    .search-result-meta { color: var(--c-label); font-size: 11px; margin-top: 3px; }
    .search-result-snippet { color: #cc9966; font-size: 11px; margin-top: 6px; line-height: 1.5; }
    .chat-msg-user { background: var(--c-panel); border-left: 3px solid var(--c-accent-dim); padding: 8px 12px; margin-bottom: 6px; color: var(--c-accent); font-size: 12px; }
    .chat-msg-ai { background: var(--c-surface); padding: 8px 12px; margin-bottom: 6px; color: #cc9966; font-size: 12px; }

    .search-action-btn {
      background: #1a0d00;
      color: var(--c-label);
      border: 1px solid var(--c-border);
      border-radius: 3px;
      padding: 2px 8px;
      font-size: 11px;
      cursor: pointer;
      font-family: var(--font);
    }
    .search-action-btn:hover { background: #2a1500; color: var(--c-accent); }

    .search-filter-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .search-filter-label { font-size: 11px; color: var(--c-label-dim); text-transform: uppercase; letter-spacing: 1px; }
    .search-filter-input {
      background: var(--c-panel);
      color: var(--c-accent);
      border: 1px solid var(--c-border-str);
      border-radius: 3px;
      padding: 4px 8px;
      font-family: var(--font);
      font-size: 11px;
    }
    .search-filter-input:focus { outline: none; border-color: var(--c-accent-dim); }
    .search-filter-input::placeholder { color: var(--c-label-dim); }
    .search-filter-clear {
      background: none;
      border: none;
      color: var(--c-label-dim);
      font-size: 11px;
      cursor: pointer;
      font-family: var(--font);
    }
    .search-filter-clear:hover { color: var(--c-error); }

    .vault-selector {
      background: var(--c-surface);
      border: 1px solid var(--c-border);
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }
    .vault-selector label {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      cursor: pointer;
      color: var(--c-label);
    }

    .search-input-row { display: flex; gap: 8px; align-items: center; }
    .search-input-row .lc-input { flex: 1; }

    .no-results { color: var(--c-label-dim); font-size: 11px; padding: 14px 0; }

    .degraded-banner {
      background: #221100;
      border: 1px solid var(--c-warn);
      color: var(--c-warn);
      padding: 8px 14px;
      font-size: 11px;
      margin-bottom: 8px;
      display: none;
    }
    .degraded-banner.visible { display: block; }

    .score-badge {
      display: inline-block;
      font-size: 10px;
      font-family: monospace;
      padding: 1px 6px;
      border-radius: 3px;
      flex-shrink: 0;
    }
    .score-high { background: #002211; color: var(--c-ok); border: 1px solid #005533; }
    .score-mid  { background: #111100; color: var(--c-pend); border: 1px solid #333300; }
    .score-low  { background: #111; color: var(--c-unk); border: 1px solid #333; }

    /* Chat pane */
    .chat-container {
      display: flex;
      flex-direction: column;
      height: 540px;
    }
    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid var(--c-border);
      margin-bottom: 8px;
    }
    .chat-header-title { font-size: 12px; color: var(--c-accent-dim); text-transform: uppercase; letter-spacing: 1px; }
    .chat-thread {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    .chat-thread > div + div { margin-top: 8px; }
    .chat-input-area {
      border-top: 1px solid var(--c-border);
      padding-top: 8px;
    }

    /* Think block */
    .think-toggle {
      background: none;
      border: none;
      color: var(--c-warn);
      font-size: 11px;
      cursor: pointer;
      font-family: var(--font);
      padding: 0;
    }
    .think-toggle:hover { color: var(--c-accent); }
    .think-body {
      background: #110a00;
      border: 1px solid var(--c-border);
      padding: 8px;
      font-size: 11px;
      color: #cc9966;
      font-family: monospace;
      white-space: pre-wrap;
      max-height: 200px;
      overflow-y: auto;
      margin-top: 4px;
    }

    /* Sources in chat */
    .chat-sources { border-top: 1px solid var(--c-border); margin-top: 8px; padding-top: 6px; }
    .chat-sources-title { font-size: 10px; color: var(--c-label-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
    .chat-source-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 2px 0;
    }
    .chat-source-path { font-size: 11px; color: var(--c-label); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  </style>
</head>
<body data-page="search">
  <div class="lc-nav"></div>

  <div class="lc-page lc-page-pad">
    <div class="lc-section-title" data-i18n="search.heading">Search & Ask</div>

    <!-- Vault selector -->
    <div style="padding:0 20px 6px;">
      <div class="vault-selector" id="vault-selector">
        <span class="search-filter-label" data-i18n="search.vault_selector">Vaults:</span>
        <!-- populated by loadVaultSelector() -->
      </div>
    </div>

    <!-- Mode tabs as bar badges -->
    <div style="padding:14px 20px 0;">
      <div class="lc-bar-badges" id="search-mode-badges">
        <div class="lc-bar-badge active" id="tab-content"
             onclick="switchMode('content')" data-mode="content">
          <div class="lc-bar-tab" style="background:#cc6600;">&#128269;</div>
          <div class="lc-bar-body">
            <div class="lc-bar-name" data-i18n="search.tab_content">Content Search</div>
            <div class="lc-bar-desc" data-i18n="search.tab_content_desc">Hybrid FTS + semantic search across extracted text</div>
            <div class="lc-bar-arrow">&#9654;</div>
          </div>
        </div>
        <div class="lc-bar-badge" id="tab-filename"
             onclick="switchMode('filename')" data-mode="filename">
          <div class="lc-bar-tab" style="background:#886600;">&#128193;</div>
          <div class="lc-bar-body">
            <div class="lc-bar-name" data-i18n="search.tab_filename">Filename Search</div>
            <div class="lc-bar-desc" data-i18n="search.tab_filename_desc">Find files by name pattern across all vaults</div>
            <div class="lc-bar-arrow">&#9654;</div>
          </div>
        </div>
        <div class="lc-bar-badge" id="tab-ask"
             onclick="switchMode('ask')" data-mode="ask">
          <div class="lc-bar-tab" style="background:#664400;">&#128172;</div>
          <div class="lc-bar-body">
            <div class="lc-bar-name" data-i18n="search.tab_ask">Ask</div>
            <div class="lc-bar-desc" data-i18n="search.tab_ask_desc">RAG — ask questions answered from your documents</div>
            <div class="lc-bar-arrow">&#9654;</div>
          </div>
        </div>
      </div>
    </div>

    <!-- ── Content Search panel ─────────────────────────────────────────────── -->
    <div id="panel-content" style="padding:14px 20px;">
      <div class="search-input-row">
        <input id="search-input" type="text"
          data-i18n-placeholder="search.content.placeholder"
          placeholder="Search document content..."
          class="lc-input"
          onkeydown="if(event.key==='Enter') doSearch()">
        <select id="search-mode" class="lc-select" style="width:auto;min-width:110px;">
          <option value="hybrid" data-i18n="search.content.mode_hybrid">Hybrid</option>
          <option value="fts" data-i18n="search.content.mode_fts">Full-text</option>
          <option value="semantic" data-i18n="search.content.mode_semantic">Semantic</option>
        </select>
        <button onclick="doSearch()" class="lc-btn lc-btn-primary" data-i18n="search.content.search_btn">Search</button>
      </div>
      <div class="search-filter-row">
        <span class="search-filter-label" data-i18n="search.filter.label">Filters:</span>
        <input id="search-filter-type" type="text"
          data-i18n-placeholder="search.filter.type_placeholder"
          placeholder="File type (pdf, docx...)"
          class="search-filter-input" style="width:130px;">
        <span data-i18n="search.filter.from" style="color:var(--c-label-dim);font-size:11px;">from</span>
        <input id="search-filter-from" type="date" class="search-filter-input">
        <span data-i18n="search.filter.to" style="color:var(--c-label-dim);font-size:11px;">to</span>
        <input id="search-filter-to" type="date" class="search-filter-input">
        <button onclick="clearFilters('search')" class="search-filter-clear" data-i18n="search.filter.clear">&#10005; Clear</button>
      </div>
      <div id="search-degraded-banner" class="degraded-banner"></div>
      <div id="search-results" style="margin-top:10px;"></div>
    </div>

    <!-- ── Filename Search panel ────────────────────────────────────────────── -->
    <div id="panel-filename" style="display:none;padding:14px 20px;">
      <div class="search-input-row">
        <input id="filename-input" type="text"
          data-i18n-placeholder="search.filename.placeholder"
          placeholder="File or folder name... (space-separated tokens all match)"
          class="lc-input"
          onkeydown="if(event.key==='Enter') doFilenameSearch()">
        <button onclick="doFilenameSearch()" class="lc-btn lc-btn-primary" data-i18n="search.filename.search_btn">Search</button>
      </div>
      <div class="search-filter-row">
        <span class="search-filter-label" data-i18n="search.filter.label">Filters:</span>
        <input id="filename-filter-type" type="text"
          data-i18n-placeholder="search.filter.type_placeholder"
          placeholder="File type (pdf, docx...)"
          class="search-filter-input" style="width:130px;">
        <span data-i18n="search.filter.from" style="color:var(--c-label-dim);font-size:11px;">from</span>
        <input id="filename-filter-from" type="date" class="search-filter-input">
        <span data-i18n="search.filter.to" style="color:var(--c-label-dim);font-size:11px;">to</span>
        <input id="filename-filter-to" type="date" class="search-filter-input">
        <button onclick="clearFilters('filename')" class="search-filter-clear" data-i18n="search.filter.clear">&#10005; Clear</button>
      </div>
      <div id="filename-results" style="margin-top:10px;"></div>
    </div>

    <!-- ── Ask / RAG panel ──────────────────────────────────────────────────── -->
    <div id="panel-ask" style="display:none;padding:14px 20px;">
      <div class="chat-container">
        <div class="chat-header">
          <span class="chat-header-title" data-i18n="search.ask.header">Ask a question about your documents</span>
          <button onclick="clearChat()" class="lc-btn lc-btn-sm lc-btn-danger" data-i18n="search.ask.clear">Clear chat</button>
        </div>
        <div id="chat-thread" class="chat-thread"></div>
        <div class="chat-input-area">
          <div class="search-filter-row" style="margin-top:0;margin-bottom:8px;">
            <span class="search-filter-label" data-i18n="search.filter.label">Filters:</span>
            <input id="chat-filter-type" type="text"
              data-i18n-placeholder="search.filter.type_placeholder"
              placeholder="File type (pdf, docx...)"
              class="search-filter-input" style="width:130px;">
            <span data-i18n="search.filter.from" style="color:var(--c-label-dim);font-size:11px;">from</span>
            <input id="chat-filter-from" type="date" class="search-filter-input">
            <span data-i18n="search.filter.to" style="color:var(--c-label-dim);font-size:11px;">to</span>
            <input id="chat-filter-to" type="date" class="search-filter-input">
            <button onclick="clearFilters('chat')" class="search-filter-clear" data-i18n="search.filter.clear">&#10005; Clear</button>
          </div>
          <div class="search-input-row">
            <input id="query-input" type="text"
              data-i18n-placeholder="search.ask.placeholder"
              placeholder="Ask anything about your documents..."
              class="lc-input"
              onkeydown="if(event.key==='Enter' && !event.shiftKey){ event.preventDefault(); doQuery(); }">
            <button onclick="doQuery()" class="lc-btn lc-btn-primary" data-i18n="search.ask.ask_btn">Ask</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="/static/lcars.js"></script>
  <script>
    let chatHistory = [];

    // ── Mode switching ──────────────────────────────────────────────────────────

    function switchMode(mode) {
      ['content','filename','ask'].forEach(m => {
        document.getElementById('tab-'+m).classList.toggle('active', m===mode);
        document.getElementById('panel-'+m).style.display = m===mode ? 'block' : 'none';
      });
      window.location.hash = mode === 'content' ? '' : mode;
    }

    // ── Content search ─────────────────────────────────────────────────────────

    function renderResults(results) {
      const el = document.getElementById('search-results');
      if (!results || !results.length) {
        el.innerHTML = `<p class="no-results">${t('search.content.no_results')}</p>`;
        return;
      }
      el.innerHTML = results.map(r => {
        const safePath = (r.file_path || '').replace(/"/g, '&quot;');
        const scoreBadge = scoreBadgeHtml(r.score);
        return `
        <div class="search-result">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;">
            <div style="display:flex;align-items:center;gap:8px;min-width:0;">
              ${scoreBadge}
              <span class="search-result-file" title="${escapeHtml(r.file_path || '')}">${escapeHtml(formatPath(r.file_path))}</span>
            </div>
            <div style="display:flex;gap:4px;flex-shrink:0;">
              <button data-path="${safePath}" onclick="openFile(this.dataset.path)" class="search-action-btn">${t('search.result.open')}</button>
              <button data-path="${safePath}" onclick="openFolder(this.dataset.path)" class="search-action-btn">${t('search.result.folder')}</button>
              <button data-path="${safePath}" onclick="inspectFile(this.dataset.path)" class="search-action-btn">${t('search.result.inspect')}</button>
            </div>
          </div>
          <div class="search-result-snippet">${escapeHtml(r.snippet || r.chunk_text || '')}</div>
        </div>`;
      }).join('');
    }

    async function doSearch() {
      const q = document.getElementById('search-input').value.trim();
      const mode = document.getElementById('search-mode').value;
      if (!q) return;
      document.getElementById('search-results').innerHTML = `<p class="no-results">${t('search.content.searching')}</p>`;
      const f = getFilters('search');
      let url = `/search?q=${encodeURIComponent(q)}&mode=${mode}`;
      if (f.file_type) url += `&file_type=${encodeURIComponent(f.file_type)}`;
      if (f.date_from)  url += `&date_from=${f.date_from}`;
      if (f.date_to)    url += `&date_to=${f.date_to}`;
      const vaultIds = getSelectedVaultIds();
      if (vaultIds.length) url += `&vault_ids=${vaultIds.join(',')}`;
      const data = await api(url);
      const banner = document.getElementById('search-degraded-banner');
      if (data.degraded) {
        banner.textContent = '\u26A0 ' + (data.degraded_reason || t('search.degraded_default'));
        banner.classList.add('visible');
      } else {
        banner.classList.remove('visible');
      }
      renderResults(data.results || data);
    }

    // ── Filename search ────────────────────────────────────────────────────────

    function formatSize(bytes) {
      if (bytes == null) return '';
      if (bytes < 1024) return `${bytes} B`;
      if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
      return `${(bytes / (1024 * 1024)).toFixed(1)} MB`;
    }

    function formatDate(iso) {
      if (!iso) return '';
      return iso.slice(0, 10);
    }

    function renderFilenameResults(results) {
      const el = document.getElementById('filename-results');
      if (!results || !results.length) {
        el.innerHTML = `<p class="no-results">${t('search.filename.no_results')}</p>`;
        return;
      }
      el.innerHTML = results.map(r => {
        const safePath = (r.file_path || '').replace(/"/g, '&quot;');
        const fname = formatPath(r.file_path);
        const ext = (r.file_type || '').toLowerCase();
        const size = formatSize(r.file_size);
        const date = formatDate(r.file_modified || r.file_created);
        const notDone = r.status && r.status !== 'COMPLETED';
        const statusHtml = notDone
          ? `<span class="lc-badge ${
              r.status === 'ERROR' ? 'lc-badge-err' : 'lc-badge-pend'
            }">${r.status}</span>`
          : '';
        const meta = [ext, size, date].filter(Boolean).join(' \u00b7 ');
        return `
        <div class="search-result">
          <div style="display:flex;align-items:start;justify-content:space-between;gap:8px;">
            <div style="min-width:0;">
              <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
                <span class="search-result-file">${escapeHtml(fname)}</span>
                ${statusHtml}
              </div>
              <div class="search-result-meta" title="${escapeHtml(r.file_path || '')}">${escapeHtml(r.file_path || '')}</div>
              <div class="search-result-meta">${escapeHtml(meta)}</div>
            </div>
            <div style="display:flex;gap:4px;flex-shrink:0;">
              <button data-path="${safePath}" onclick="openFile(this.dataset.path)" class="search-action-btn">${t('search.result.open')}</button>
              <button data-path="${safePath}" onclick="openFolder(this.dataset.path)" class="search-action-btn">${t('search.result.folder')}</button>
              <button data-path="${safePath}" onclick="inspectFile(this.dataset.path)" class="search-action-btn">${t('search.result.inspect')}</button>
            </div>
          </div>
        </div>`;
      }).join('');
    }

    async function doFilenameSearch() {
      const q = document.getElementById('filename-input').value.trim();
      if (!q) return;
      document.getElementById('filename-results').innerHTML = `<p class="no-results">${t('search.filename.searching')}</p>`;
      const f = getFilters('filename');
      let url = `/search/filename?q=${encodeURIComponent(q)}`;
      if (f.file_type) url += `&file_type=${encodeURIComponent(f.file_type)}`;
      if (f.date_from)  url += `&date_from=${f.date_from}`;
      if (f.date_to)    url += `&date_to=${f.date_to}`;
      const vaultIds = getSelectedVaultIds();
      if (vaultIds.length) url += `&vault_ids=${vaultIds.join(',')}`;
      const results = await api(url);
      renderFilenameResults(results);
    }

    // ── Shared filter helpers ──────────────────────────────────────────────────

    function getFilters(prefix) {
      return {
        file_type: document.getElementById(`${prefix}-filter-type`).value.trim(),
        date_from:  document.getElementById(`${prefix}-filter-from`).value,
        date_to:    document.getElementById(`${prefix}-filter-to`).value,
      };
    }

    function clearFilters(prefix) {
      document.getElementById(`${prefix}-filter-type`).value = '';
      document.getElementById(`${prefix}-filter-from`).value = '';
      document.getElementById(`${prefix}-filter-to`).value = '';
    }

    // ── Chat / Ask ─────────────────────────────────────────────────────────────

    async function doQuery() {
      const input = document.getElementById('query-input');
      const question = input.value.trim();
      if (!question) return;
      input.value = '';

      appendUserBubble(question);
      const loadingId = appendLoadingBubble();

      const cf = getFilters('chat');
      const vaultIds = getSelectedVaultIds();
      let resp;
      try {
        resp = await api('/query', {
          method: 'POST',
          body: JSON.stringify({
            question,
            history: chatHistory,
            file_type: cf.file_type || null,
            date_from:  cf.date_from  || null,
            date_to:    cf.date_to    || null,
            vault_ids: vaultIds.length ? vaultIds.join(',') : null,
          }),
        });
      } catch (err) {
        removeLoading(loadingId);
        appendAssistantBubble(`Error: ${err.message}`, null, []);
        return;
      }

      removeLoading(loadingId);
      appendAssistantBubble(resp.answer, resp.thinking, resp.sources || []);
      chatHistory.push({ role: 'user', content: question });
      chatHistory.push({ role: 'assistant', content: resp.answer });
    }

    function clearChat() {
      chatHistory = [];
      document.getElementById('chat-thread').innerHTML = '';
    }

    function appendUserBubble(text) {
      const thread = document.getElementById('chat-thread');
      const div = document.createElement('div');
      div.innerHTML = `<div class="chat-msg-user">${escapeHtml(text)}</div>`;
      thread.appendChild(div);
      scrollChat();
    }

    function appendLoadingBubble() {
      const thread = document.getElementById('chat-thread');
      const id = 'loading-' + Date.now();
      const div = document.createElement('div');
      div.id = id;
      div.innerHTML = `<div class="chat-msg-ai" style="color:var(--c-label-dim);">${t('search.ask.thinking')}</div>`;
      thread.appendChild(div);
      scrollChat();
      return id;
    }

    function removeLoading(id) {
      document.getElementById(id)?.remove();
    }

    let thinkCounter = 0;
    function appendAssistantBubble(answer, thinking, sources) {
      const thread = document.getElementById('chat-thread');
      const div = document.createElement('div');

      const seenPaths = new Set();
      const uniqueSources = sources.filter(s => {
        if (!s.file_path || seenPaths.has(s.file_path)) return false;
        seenPaths.add(s.file_path);
        return true;
      });

      const tid = `think-${++thinkCounter}`;
      const thinkHtml = thinking ? `
        <div style="margin-top:6px;">
          <button onclick="toggleThink('${tid}')" class="think-toggle">
            <span id="${tid}-chevron">&#9654;</span> ${t('search.ask.model_thinking')}
          </button>
          <div id="${tid}" class="think-body" style="display:none;">
            ${escapeHtml(thinking)}
          </div>
        </div>` : '';

      const sourcesHtml = uniqueSources.length ? `
        <div class="chat-sources">
          <div class="chat-sources-title">${t('search.ask.sources')}</div>
          ${uniqueSources.map(s => {
            const safePath = (s.file_path || '').replace(/"/g, '&quot;');
            return `
            <div class="chat-source-row">
              <span class="chat-source-path" title="${escapeHtml(s.file_path)}">${escapeHtml(formatPath(s.file_path))}</span>
              <div style="display:flex;gap:4px;flex-shrink:0;">
                <button data-path="${safePath}" onclick="openFile(this.dataset.path)" class="search-action-btn">${t('search.result.open')}</button>
                <button data-path="${safePath}" onclick="openFolder(this.dataset.path)" class="search-action-btn">${t('search.result.folder')}</button>
                <button data-path="${safePath}" onclick="inspectFile(this.dataset.path)" class="search-action-btn">${t('search.result.inspect')}</button>
              </div>
            </div>`;
          }).join('')}
        </div>` : '';

      div.innerHTML = `
        <div class="chat-msg-ai">
          ${thinkHtml}
          <div style="white-space:pre-wrap;">${escapeHtml(answer)}</div>
          ${sourcesHtml}
        </div>`;
      thread.appendChild(div);
      scrollChat();
    }

    function toggleThink(id) {
      const body = document.getElementById(id);
      const chevron = document.getElementById(`${id}-chevron`);
      const isHidden = body.style.display === 'none';
      body.style.display = isHidden ? 'block' : 'none';
      chevron.innerHTML = isHidden ? '&#9660;' : '&#9654;';
    }

    function scrollChat() {
      const thread = document.getElementById('chat-thread');
      thread.scrollTop = thread.scrollHeight;
    }

    function escapeHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function scoreBadgeHtml(score) {
      if (score == null) return '';
      const pct = Math.round(score * 100);
      const cls = pct >= 80 ? 'score-high'
                : pct >= 65 ? 'score-mid'
                :             'score-low';
      return `<span class="score-badge ${cls}">${pct}%</span>`;
    }

    // ── Vault selector ─────────────────────────────────────────────────────────

    async function loadVaultSelector() {
      const vaults = await api('/vaults');
      const container = document.getElementById('vault-selector');
      if (!vaults.length) return;
      vaults.forEach(v => {
        const label = document.createElement('label');
        label.innerHTML = `<input type="checkbox" class="vault-cb" value="${v.vault_id}" checked>
          <span style="color:${v.color||'var(--c-accent)'};font-weight:bold;">${v.name}</span>`;
        container.appendChild(label);
      });
    }

    function getSelectedVaultIds() {
      return [...document.querySelectorAll('.vault-cb:checked')].map(cb => cb.value);
    }

    // ── Init ───────────────────────────────────────────────────────────────────

    document.addEventListener('lc:ready', () => {
      const _modeMap = { search: 'content', content: 'content', filename: 'filename', ask: 'ask' };
      const _initialMode = _modeMap[window.location.hash.replace('#','')] || 'content';
      switchMode(_initialMode);
      loadVaultSelector();
    });
  </script>
</body>
</html>
