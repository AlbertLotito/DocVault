<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DocVault — Vault Status</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="/static/styles.css" rel="stylesheet">
  <script src="/static/app.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <nav class="bg-indigo-700 text-white px-6 py-3 flex gap-6 items-center shadow">
    <span class="font-bold text-lg">DocVault</span>
    <a href="/search" class="hover:underline">Search</a>
    <a href="/" class="hover:underline font-semibold">Vault Status</a>
    <a href="/catalog" class="hover:underline">Vault Log</a>
    <a href="/utils" class="hover:underline">Utilities</a>
    <a href="/settings" class="hover:underline">Settings</a>
  </nav>

  <!-- Resource strip -->
  <div id="resource-strip" class="bg-gray-800 text-gray-200 text-xs px-6 py-2 font-mono">
    Loading hardware stats...
  </div>

  <main class="max-w-6xl mx-auto p-6">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-gray-800">Vault Status</h1>
      <div class="flex gap-3">
        <button onclick="pauseWorkers()" class="bg-yellow-400 hover:bg-yellow-500 text-white px-4 py-1.5 rounded text-sm">Pause</button>
        <button onclick="resumeWorkers()" class="bg-green-500 hover:bg-green-600 text-white px-4 py-1.5 rounded text-sm">Resume</button>
        <span id="pause-status" class="text-sm text-gray-600 self-center">—</span>
      </div>
    </div>

    <!-- Global stats row -->
    <div id="stats" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-3 mb-8">
      <a href="/catalog" class="bg-white rounded shadow p-3 text-center block hover:shadow-md hover:bg-indigo-50 transition-shadow">
        <div id="stat-total" class="text-2xl font-bold text-indigo-600">—</div>
        <div class="text-xs text-gray-500 mt-1">Total</div>
      </a>
      <a href="/catalog?status=PENDING" class="bg-white rounded shadow p-3 text-center block hover:shadow-md hover:bg-gray-50 transition-shadow">
        <div id="stat-pending" class="text-2xl font-bold text-gray-500">—</div>
        <div class="text-xs text-gray-500 mt-1">Pending</div>
      </a>
      <a href="/catalog?status=PROCESSING" class="bg-white rounded shadow p-3 text-center block hover:shadow-md hover:bg-purple-50 transition-shadow">
        <div id="stat-processing" class="text-2xl font-bold text-purple-500">—</div>
        <div class="text-xs text-gray-500 mt-1">Processing</div>
      </a>
      <a href="/catalog?status=EXTRACTED" class="bg-white rounded shadow p-3 text-center block hover:shadow-md hover:bg-blue-50 transition-shadow">
        <div id="stat-extracted" class="text-2xl font-bold text-blue-500">—</div>
        <div class="text-xs text-gray-500 mt-1">Extracted</div>
      </a>
      <a href="/catalog?status=EMBEDDING" class="bg-white rounded shadow p-3 text-center block hover:shadow-md hover:bg-purple-50 transition-shadow">
        <div id="stat-embedding" class="text-2xl font-bold text-purple-500">—</div>
        <div class="text-xs text-gray-500 mt-1">Embedding</div>
      </a>
      <a href="/catalog?status=COMPLETED" class="bg-white rounded shadow p-3 text-center block hover:shadow-md hover:bg-green-50 transition-shadow">
        <div id="stat-completed" class="text-2xl font-bold text-green-600">—</div>
        <div class="text-xs text-gray-500 mt-1">Completed</div>
      </a>
      <a href="/catalog?status=ERROR" class="bg-white rounded shadow p-3 text-center block hover:shadow-md hover:bg-red-50 transition-shadow">
        <div id="stat-error" class="text-2xl font-bold text-red-500">—</div>
        <div class="text-xs text-gray-500 mt-1">Errors</div>
      </a>
    </div>

    <!-- Vault cards -->
    <div class="mb-8">
      <div class="flex justify-between items-center mb-3">
        <h2 class="text-lg font-semibold text-gray-700">Vaults</h2>
        <a href="/settings" class="text-sm text-indigo-600 hover:underline">Manage vaults</a>
      </div>
      <div id="vault-cards" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <div class="text-sm text-gray-400">Loading vaults...</div>
      </div>
    </div>

    <!-- Worker controls / misc -->
    <div class="bg-white rounded shadow p-4 mb-4">
      <h2 class="font-semibold text-gray-700 mb-3">Maintenance</h2>
      <div class="flex gap-3 flex-wrap">
        <button onclick="resetStuck()" class="bg-red-100 hover:bg-red-200 text-red-700 px-4 py-1.5 rounded text-sm">Reset Stuck Tasks</button>
      </div>
    </div>

    <!-- Unknown file types -->
    <div class="bg-white rounded shadow p-4">
      <h2 class="font-semibold text-gray-700 mb-3">Unknown File Types</h2>
      <div id="unknowns" class="text-sm text-gray-500">Loading...</div>
    </div>
  </main>

  <script>
    async function loadResourceStrip() {
      try {
        const data = await api('/monitor/status');
        const stateColors = {normal: '#22c55e', throttled: '#f59e0b', cooldown: '#ef4444'};
        const dot = `<span style="color:${stateColors[data.state] || '#9ca3af'}">&#9679;</span>`;
        if (!data.available) {
          document.getElementById('resource-strip').innerHTML =
            `${dot} ${data.state} &nbsp;|&nbsp; No hardware sensors available`;
          return;
        }
        document.getElementById('resource-strip').innerHTML =
          `CPU&nbsp;${(data.cpu_temp||0).toFixed(0)}&deg;C&nbsp;&nbsp;${(data.cpu_pct||0).toFixed(0)}%` +
          `&nbsp;&nbsp;|&nbsp;&nbsp;` +
          `RAM&nbsp;${(data.ram_used_gb||0).toFixed(1)}&nbsp;/&nbsp;${(data.ram_total_gb||0).toFixed(0)}&nbsp;GB` +
          `&nbsp;&nbsp;|&nbsp;&nbsp;` +
          `GPU&nbsp;${(data.gpu_temp||0).toFixed(0)}&deg;C&nbsp;&nbsp;${(data.gpu_util_pct||0).toFixed(0)}%` +
          `&nbsp;&nbsp;${dot}&nbsp;${data.state}`;
      } catch(e) {
        document.getElementById('resource-strip').textContent = 'Hardware stats unavailable';
      }
    }

    async function loadVaultCards() {
      const container = document.getElementById('vault-cards');
      try {
        const vaults = await api('/vaults');
        if (!vaults.length) {
          container.innerHTML = '<div class="text-sm text-gray-400">No active vaults.</div>';
          return;
        }
        container.innerHTML = vaults.map(v => `
          <div class="bg-white rounded shadow p-4 border-l-4" style="border-color:${v.color||'#6366f1'}">
            <div class="flex justify-between items-start mb-2">
              <div>
                <div class="font-semibold text-gray-800">${v.name}</div>
                <div class="text-xs text-gray-400 truncate max-w-xs" title="${v.scan_directory}">${v.scan_directory}</div>
              </div>
              <span class="text-xs px-2 py-0.5 rounded-full ${v.state==='active'?'bg-green-100 text-green-700':'bg-gray-100 text-gray-500'}">${v.state}</span>
            </div>
            <div class="text-xs text-gray-500">Priority ${v.priority}</div>
            <div class="mt-3 flex gap-2">
              <a href="/catalog?vault_id=${v.vault_id}" class="text-xs text-indigo-600 hover:underline">View files</a>
            </div>
          </div>
        `).join('');
      } catch(e) {
        container.innerHTML = '<div class="text-sm text-red-400">Could not load vaults.</div>';
      }
    }

    async function loadStats() {
      const s = await api('/stats');
      document.getElementById('stat-total').textContent = s.total || '0';
      document.getElementById('stat-pending').textContent = s.pending || '0';
      document.getElementById('stat-processing').textContent = s.processing || '0';
      document.getElementById('stat-extracted').textContent = s.extracted || '0';
      document.getElementById('stat-embedding').textContent = s.embedding || '0';
      document.getElementById('stat-completed').textContent = s.completed || '0';
      document.getElementById('stat-error').textContent = s.error || '0';
    }

    async function loadWorkerStatus() {
      const s = await api('/workers/status');
      document.getElementById('pause-status').textContent =
        s.paused ? '⏸ Paused' : '▶ Running';
    }

    async function loadUnknowns() {
      const items = await api('/catalog?status=UNKNOWN&limit=20');
      const el = document.getElementById('unknowns');
      if (!items.length) { el.textContent = 'None'; return; }
      el.innerHTML = items.map(i =>
        `<div class="py-1">${i.file_type || '?'} — ${formatPath(i.file_path)}</div>`
      ).join('');
    }

    async function pauseWorkers() {
      await api('/workers/pause', { method: 'POST' });
      loadWorkerStatus();
    }

    async function resumeWorkers() {
      await api('/workers/resume', { method: 'POST' });
      loadWorkerStatus();
    }

    async function resetStuck() {
      const r = await api('/workers/reset_stuck', { method: 'POST' });
      alert(`Reset ${r.reset} stuck task(s) back to PENDING.`);
      loadStats();
    }

    function refreshAll() {
      loadStats();
      loadWorkerStatus();
      loadUnknowns();
      loadResourceStrip();
      loadVaultCards();
    }

    document.addEventListener('DOMContentLoaded', () => {
      refreshAll();
      setInterval(loadStats, 5000);
      setInterval(loadWorkerStatus, 5000);
      setInterval(loadResourceStrip, 10000);
      setInterval(loadVaultCards, 30000);
      setInterval(loadUnknowns, 30000);
    });
  </script>
</body>
</html>
