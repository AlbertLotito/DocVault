<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DocVault — Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="/static/styles.css" rel="stylesheet">
  <script src="/static/app.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
  <nav class="bg-indigo-700 text-white px-6 py-3 flex gap-6 items-center shadow">
    <span class="font-bold text-lg">DocVault</span>
    <a href="/" class="hover:underline font-semibold">Dashboard</a>
    <a href="/catalog" class="hover:underline">Catalog</a>
    <a href="/search" class="hover:underline">Search</a>
    <a href="/utils" class="hover:underline">Utilities</a>
    <a href="/settings" class="hover:underline">Settings</a>
  </nav>

  <main class="max-w-5xl mx-auto p-6">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-2xl font-bold text-gray-800">Dashboard</h1>
      <button onclick="refreshAll()" class="bg-gray-200 hover:bg-gray-300 text-gray-700 px-4 py-1.5 rounded text-sm font-medium">
        Refresh Now
      </button>
    </div>

    <!-- Stats cards (click to filter catalog) -->
    <div id="stats" class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-7 gap-4 mb-8">
      <a href="/catalog" class="bg-white rounded shadow p-4 text-center block hover:shadow-md hover:bg-indigo-50 transition-shadow">
        <div id="stat-total" class="text-3xl font-bold text-indigo-600">—</div>
        <div class="text-sm text-gray-500 mt-1">Total</div>
      </a>
      <a href="/catalog?status=PENDING" class="bg-white rounded shadow p-4 text-center block hover:shadow-md hover:bg-gray-50 transition-shadow">
        <div id="stat-pending" class="text-3xl font-bold text-gray-500">—</div>
        <div class="text-sm text-gray-500 mt-1">Pending</div>
      </a>
      <a href="/catalog?status=PROCESSING" class="bg-white rounded shadow p-4 text-center block hover:shadow-md hover:bg-purple-50 transition-shadow">
        <div id="stat-processing" class="text-3xl font-bold text-purple-500">—</div>
        <div class="text-sm text-gray-500 mt-1">Processing</div>
      </a>
      <a href="/catalog?status=EXTRACTED" class="bg-white rounded shadow p-4 text-center block hover:shadow-md hover:bg-blue-50 transition-shadow">
        <div id="stat-extracted" class="text-3xl font-bold text-blue-500">—</div>
        <div class="text-sm text-gray-500 mt-1">Extracted</div>
      </a>
      <a href="/catalog?status=EMBEDDING" class="bg-white rounded shadow p-4 text-center block hover:shadow-md hover:bg-purple-50 transition-shadow">
        <div id="stat-embedding" class="text-3xl font-bold text-purple-500">—</div>
        <div class="text-sm text-gray-500 mt-1">Embedding</div>
      </a>
      <a href="/catalog?status=COMPLETED" class="bg-white rounded shadow p-4 text-center block hover:shadow-md hover:bg-green-50 transition-shadow">
        <div id="stat-completed" class="text-3xl font-bold text-green-600">—</div>
        <div class="text-sm text-gray-500 mt-1">Completed</div>
      </a>
      <a href="/catalog?status=ERROR" class="bg-white rounded shadow p-4 text-center block hover:shadow-md hover:bg-red-50 transition-shadow">
        <div id="stat-error" class="text-3xl font-bold text-red-500">—</div>
        <div class="text-sm text-gray-500 mt-1">Errors</div>
      </a>
    </div>

    <!-- Worker controls -->
    <div class="bg-white rounded shadow p-6 mb-6">
      <h2 class="font-semibold text-gray-700 mb-3">Worker Controls</h2>
      <div class="flex gap-3 items-center">
        <span id="pause-status" class="text-sm text-gray-600">—</span>
        <button onclick="pauseWorkers()" class="bg-yellow-400 hover:bg-yellow-500 text-white px-4 py-1.5 rounded text-sm">Pause</button>
        <button onclick="resumeWorkers()" class="bg-green-500 hover:bg-green-600 text-white px-4 py-1.5 rounded text-sm">Resume</button>
        <button onclick="resetStuck()" class="bg-red-100 hover:bg-red-200 text-red-700 px-4 py-1.5 rounded text-sm">Reset Stuck Tasks</button>
      </div>
    </div>

    <!-- Unknown file types -->
    <div class="bg-white rounded shadow p-6">
      <h2 class="font-semibold text-gray-700 mb-3">Unknown File Types</h2>
      <div id="unknowns" class="text-sm text-gray-500">Loading...</div>
    </div>
  </main>

  <script>
    async function loadStats() {
      const s = await api('/stats');
      document.getElementById('stat-total').textContent = s.total || '0';
      document.getElementById('stat-pending').textContent = s.pending || '0';
      document.getElementById('stat-processing').textContent = s.processing || '0';
      document.getElementById('stat-extracted').textContent = s.extracted || '0';
      document.getElementById('stat-embedding').textContent = s.embedding || '0';
      document.getElementById('stat-completed').textContent = s.completed || '0';
      document.getElementById('stat-error').textContent = s.error || '0';
    }

    async function loadWorkerStatus() {
      const s = await api('/workers/status');
      document.getElementById('pause-status').textContent =
        s.paused ? '⏸ Workers are PAUSED' : '▶ Workers are RUNNING';
    }

    async function loadUnknowns() {
      const items = await api('/catalog?status=UNKNOWN&limit=20');
      const el = document.getElementById('unknowns');
      if (!items.length) { el.textContent = 'None'; return; }
      el.innerHTML = items.map(i =>
        `<div class="py-1">${i.file_type || '?'} — ${formatPath(i.file_path)}</div>`
      ).join('');
    }

    function refreshAll() {
        loadStats();
        loadWorkerStatus();
        loadUnknowns();
    }

    async function pauseWorkers() {
      await api('/workers/pause', { method: 'POST' });
      loadWorkerStatus();
    }

    async function resumeWorkers() {
      await api('/workers/resume', { method: 'POST' });
      loadWorkerStatus();
    }

    async function resetStuck() {
      const r = await api('/workers/reset_stuck', { method: 'POST' });
      alert(`Reset ${r.reset} stuck task(s) back to PENDING.`);
      loadStats();
    }

    function init() {
        refreshAll();
        setInterval(refreshAll, 5000);
    }
    
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
